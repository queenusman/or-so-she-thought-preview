<!DOCTYPE html>
<html lang="en" class="scroll-smooth theme-dark" id="rootHtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OR SO SHE THOUGHT — Official Novel Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            theme: {
              bg: 'var(--color-bg)',
              'bg-deep': 'var(--color-bg-deep)',
              panel: 'var(--color-panel)',
              'panel-accent': 'var(--color-panel-accent)',
              border: 'var(--color-border)',
              'border-subtle': 'var(--color-border-subtle)',
              text: 'var(--color-text)',
              'text-muted': 'var(--color-text-muted)',
              'text-faint': 'var(--color-text-faint)',
              accent: 'var(--color-accent)',
              'accent-hover': 'var(--color-accent-hover)',
              'accent-dim': 'var(--color-accent-dim)',
              burgundy: 'var(--color-burgundy)',
              'burgundy-box': 'var(--color-burgundy-box)',
            }
          },
          fontFamily: {
            serif: ['Cormorant Garamond', 'Georgia', 'serif'],
            display: ['Cinzel', 'serif'],
            body: ['Newsreader', 'Georgia', 'serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* Default: Night Ink Mode */
    :root, .theme-dark {
      --color-bg: #11100f;
      --color-bg-deep: #090807;
      --color-panel: #181715;
      --color-panel-accent: #211e1a;
      --color-border: #38342e;
      --color-border-subtle: #26231f;
      --color-text: #f5f1e8;
      --color-text-muted: #bab1a2;
      --color-text-faint: #787166;
      --color-accent: #c4a166;
      --color-accent-hover: #dfba7c;
      --color-accent-dim: rgba(196, 161, 102, 0.14);
      --color-burgundy: #a1434d;
      --color-burgundy-box: rgba(161, 67, 77, 0.14);
      --header-bg: rgba(17, 16, 15, 0.94);
      --footer-bg: #0c0b0a;
      --primary-btn-bg: #c4a166;
      --primary-btn-text: #0e0d0c;
    }

    /* Ivory Paper Archival Mode (WCAG AAA Contrast Compliant) */
    .theme-ivory {
      --color-bg: #f8f5ee;
      --color-bg-deep: #ede6d8;
      --color-panel: #f1ebdE;
      --color-panel-accent: #e5ded0;
      --color-border: #ccbeaa;
      --color-border-subtle: #ded5c5;
      --color-text: #1c1815;
      --color-text-muted: #4e443a;
      --color-text-faint: #73675a;
      --color-accent: #876228;
      --color-accent-hover: #6d4e1d;
      --color-accent-dim: rgba(135, 98, 40, 0.12);
      --color-burgundy: #7a222a;
      --color-burgundy-box: rgba(122, 34, 42, 0.08);
      --header-bg: rgba(248, 245, 238, 0.96);
      --footer-bg: #eae3d5;
      --primary-btn-bg: #876228;
      --primary-btn-text: #fdfcf9;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: 'Newsreader', Georgia, serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    ::selection {
      background-color: var(--color-accent);
      color: var(--color-bg);
    }

    .view-section {
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .view-hidden {
      display: none !important;
      opacity: 0;
      transform: translateY(6px);
    }
    .view-visible {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body class="bg-theme-bg text-theme-text min-h-screen flex flex-col justify-between selection:bg-theme-accent selection:text-theme-bg">

  <header id="siteHeader" style="background-color: var(--header-bg); border-color: var(--color-border);" class="sticky top-0 z-50 backdrop-blur-md border-b transition-colors duration-300">
    <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">

      <!-- Brand Link: Always returns Home -->
      <a href="javascript:void(0)" onclick="switchView('home')" class="group flex flex-col focus:outline-none" aria-label="Return to Home">
        <span class="font-display tracking-[0.22em] text-base md:text-lg font-semibold text-theme-text group-hover:text-theme-accent transition-colors">
          OR SO SHE THOUGHT
        </span>
        <span class="font-sans text-[10px] tracking-[0.25em] text-theme-accent uppercase font-medium">
          A Novel of Norwyn
        </span>
      </a>

      <!-- Primary Navigation: Strictly Unique Non-Overlapping Views -->
      <nav class="hidden lg:flex items-center space-x-7 text-xs font-sans uppercase tracking-[0.18em]">
        <button onclick="switchView('home')" class="nav-button py-2 text-theme-text border-b-2 border-theme-accent transition-colors" data-page="home">
          Home
        </button>
        <button onclick="switchView('eras')" class="nav-button py-2 text-theme-text-muted hover:text-theme-text border-b-2 border-transparent transition-colors" data-page="eras">
          The Two Eras
        </button>
        <button onclick="switchView('reader')" class="nav-button py-2 text-theme-text-muted hover:text-theme-text border-b-2 border-transparent transition-colors" data-page="reader">
          Read
        </button>
        <button onclick="switchView('world')" class="nav-button py-2 text-theme-text-muted hover:text-theme-text border-b-2 border-transparent transition-colors" data-page="world">
          The World
        </button>
        <button onclick="switchView('characters')" class="nav-button py-2 text-theme-text-muted hover:text-theme-text border-b-2 border-transparent transition-colors" data-page="characters">
          Characters
        </button>
        <button onclick="switchView('archive')" class="nav-button py-2 text-theme-text-muted hover:text-theme-text border-b-2 border-transparent transition-colors" data-page="archive">
          Archive
        </button>
      </nav>

      <!-- Global Theme Switcher & Mobile Menu Trigger -->
      <div class="flex items-center space-x-3">
        <button onclick="toggleGlobalTheme()" id="globalThemeBtn" aria-label="Toggle paper palette" class="px-3 py-1.5 border border-theme-border rounded-sm text-[11px] font-sans uppercase tracking-wider text-theme-text-muted hover:text-theme-text hover:border-theme-accent transition-colors flex items-center gap-1.5 bg-theme-panel">
          <svg id="themeIconSun" class="w-3.5 h-3.5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <svg id="themeIconMoon" class="w-3.5 h-3.5 inline-block" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
          <span id="themeToggleText">Ivory Mode</span>
        </button>

        <button onclick="toggleMobileNav()" class="p-2 lg:hidden text-theme-text hover:text-theme-accent focus:outline-none" aria-label="Open mobile menu">
          <svg id="hamburgerIcon" class="w-6 h-6 stroke-current" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Navigation Drawer -->
    <div id="mobileNav" class="hidden lg:hidden border-b border-theme-border bg-theme-panel px-6 py-6 space-y-4 text-xs font-sans uppercase tracking-[0.2em]">
      <button onclick="switchView('home'); toggleMobileNav()" class="block w-full text-left py-2 text-theme-text">Home</button>
      <button onclick="switchView('eras'); toggleMobileNav()" class="block w-full text-left py-2 text-theme-text-muted hover:text-theme-text">The Two Eras</button>
      <button onclick="switchView('reader'); toggleMobileNav()" class="block w-full text-left py-2 text-theme-text-muted hover:text-theme-text">Read</button>
      <button onclick="switchView('world'); toggleMobileNav()" class="block w-full text-left py-2 text-theme-text-muted hover:text-theme-text">The World</button>
      <button onclick="switchView('characters'); toggleMobileNav()" class="block w-full text-left py-2 text-theme-text-muted hover:text-theme-text">Characters</button>
      <button onclick="switchView('archive'); toggleMobileNav()" class="block w-full text-left py-2 text-theme-text-muted hover:text-theme-text">Archive</button>
    </div>
  </header>
