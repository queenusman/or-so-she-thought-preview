<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OR SO SHE THOUGHT — A Novel by Queen Usman</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --desk-bg: #141210;
      --book-cover: #1b1713;
      --page-bg: #f7f3eb;
      --page-bg-alt: #f0eae1;
      --ink: #1f1b16;
      --ink-muted: #575249;
      --ink-faint: #8a8377;
      --border: #d9d1c1;
      --gutter-shadow: linear-gradient(to right, rgba(0,0,0,0.06), rgba(0,0,0,0.22), rgba(0,0,0,0.04));
      --font-serif: "Cormorant Garamond", Georgia, serif;
      --font-sans: "Plus Jakarta Sans", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: var(--desk-bg);
      color: var(--ink);
      font-family: var(--font-sans);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    /* Ambient Desk Stage */
    .desk-stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      perspective: 1600px;
      overflow: hidden;
    }

    /* =========================================================
       1. CLOSED BOOK COVER STATE
       ========================================================= */
    .closed-book-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
      z-index: 10;
    }

    .closed-book-wrapper.opening {
      transform: scale(1.15) rotateY(-18deg) translateZ(100px);
      opacity: 0;
      pointer-events: none;
    }

    .physical-hardcover {
      width: min(72vw, 320px);
      height: min(108vw, 480px);
      background: var(--book-cover);
      border-radius: 4px 14px 14px 4px;
      position: relative;
      box-shadow: 
        -20px 30px 60px rgba(0, 0, 0, 0.7),
        -3px 0 10px rgba(0, 0, 0, 0.5) inset,
        4px 0 8px rgba(255, 255, 255, 0.1) inset;
      overflow: hidden;
      transform: rotateY(-12deg) rotateX(4deg);
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.5s ease;
    }

    .physical-hardcover:hover {
      transform: rotateY(0deg) rotateX(0deg) translateY(-8px);
      box-shadow: 0 35px 70px rgba(0, 0, 0, 0.8);
    }

    .hardcover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .spine-crease {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 16px;
      width: 3px;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 1px 0 3px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }

    .open-prompt {
      margin-top: 2rem;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(247, 243, 235, 0.55);
      font-weight: 500;
      animation: pulsePrompt 2.5s infinite ease-in-out;
    }

    @keyframes pulsePrompt {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }

    /* =========================================================
       2. OPENED BOOK SPREAD STATE
       ========================================================= */
    .opened-book-spread {
      display: none;
      width: min(96vw, 1040px);
      height: min(92vh, 720px);
      background: var(--page-bg);
      border-radius: 4px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255,255,255,0.06);
      position: relative;
      opacity: 0;
      transform: scale(0.94);
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.7s ease;
      overflow: hidden;
    }

    .opened-book-spread.active {
      display: grid;
      grid-template-columns: 1fr 1fr;
      opacity: 1;
      transform: scale(1);
    }

    /* Center Book Gutter Shadow */
    .book-center-gutter {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 32px;
      background: var(--gutter-shadow);
      transform: translateX(-50%);
      z-index: 20;
      pointer-events: none;
    }

    /* Individual Page Panels */
    .book-page-panel {
      padding: 3.2rem 3rem 3.8rem;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
      position: relative;
      -webkit-overflow-scrolling: touch;
    }

    .book-page-panel:first-child {
      border-right: 1px solid var(--border);
      background-image: linear-gradient(to left, rgba(0,0,0,0.02), transparent);
    }

    .book-page-panel:last-child {
      background-image: linear-gradient(to right, rgba(0,0,0,0.02), transparent);
    }

    /* Page Header & Footers */
    .page-header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
      margin-bottom: 1.8rem;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .page-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      margin-top: 2rem;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .page-nav-btn {
      background: none;
      border: none;
      font-family: var(--font-sans);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      padding: 0.3rem 0.6rem;
      transition: opacity 0.2s ease;
    }

    .page-nav-btn:hover {
      opacity: 0.6;
    }

    /* Page Typography & Content Elements */
    .book-heading-serif {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-weight: 600;
      line-height: 1.15;
      color: var(--ink);
      margin-bottom: 1.2rem;
    }

    .book-subheading-serif {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-style: italic;
      color: var(--ink-muted);
      margin-bottom: 1.2rem;
      line-height: 1.4;
    }

    .book-prose {
      font-size: 0.98rem;
      line-height: 1.85;
      color: var(--ink-muted);
      margin-bottom: 1.2rem;
    }

    .book-prose strong {
      color: var(--ink);
      font-weight: 600;
    }

    /* Contents Navigation List */
    .contents-list {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      margin-top: 0.5rem;
    }

    .contents-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 0.5rem;
      border-bottom: 1px dashed var(--border);
      cursor: pointer;
      font-family: var(--font-serif);
      font-size: 1.1rem;
      color: var(--ink);
      transition: color 0.2s ease, padding-left 0.2s ease;
    }

    .contents-item:hover {
      color: var(--ink-muted);
      padding-left: 6px;
    }

    .contents-num {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      color: var(--ink-faint);
    }

    /* Accordions inside Book */
    .book-accordion {
      border: 1px solid var(--border);
      border-radius: 3px;
      margin-bottom: 0.75rem;
      background: var(--page-bg-alt);
    }

    .book-accordion-btn {
      width: 100%;
      background: none;
      border: none;
      padding: 0.95rem 1.1rem;
      text-align: left;
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .book-accordion-content {
      display: none;
      padding: 0 1.1rem 1.1rem;
      font-size: 0.92rem;
      color: var(--ink-muted);
      line-height: 1.75;
      border-top: 1px dashed var(--border);
    }

    .book-accordion.open .book-accordion-content {
      display: block;
    }

    /* Contact Form inside Book */
    .book-contact-form {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-top: 0.8rem;
    }

    .book-input, .book-textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid var(--border);
      background: var(--page-bg-alt);
      font-family: var(--font-sans);
      font-size: 0.92rem;
      color: var(--ink);
      border-radius: 2px;
      outline: none;
    }

    .book-textarea {
      min-height: 105px;
      resize: vertical;
    }

    .book-submit-btn {
      width: 100%;
      padding: 0.85rem;
      background: var(--ink);
      color: var(--page-bg);
      border: none;
      font-family: var(--font-sans);
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .book-submit-btn:hover {
      background: #383129;
    }

    /* Responsive Adaptation for Mobile / Narrow Screens */
    @media (max-width: 820px) {
      .opened-book-spread {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
      .opened-book-spread.active {
        display: block; /* Single page view on mobile */
      }
      .book-center-gutter {
        display: none;
      }
      .book-page-panel {
        display: none;
        height: 100%;
        padding: 1.5rem 1.25rem 2rem;
      }
      .book-page-panel.mobile-active {
        display: flex;
      }
      .book-page-panel:first-child {
        border-right: none;
      }
      .book-heading-serif {
        font-size: 1.8rem;
      }
    }
  </style>
</head>

            <div class="book-accordion" onclick="toggleBookAccordion(this)">

              <div class="book-accordion-content">Family, culture, circumstance, and expectation participate in forming a person. Where does influence end and choice begin?</div>
            </div>
            <div class="book-accordion" onclick="toggleBookAccordion(this)">
              <button class="book-accordion-btn"><span>Can a life chosen for you become your own?</span><span>+</span></button>
              <div class="book-accordion-content">We inherit ideas about what a good life should look like. Sometimes we reject them; sometimes we keep them.</div>
            </div>
            <div class="book-accordion" onclick="toggleBookAccordion(this)">
              <button class="book-accordion-btn"><span>Can love and control exist together?</span><span>+</span></button>
              <div class="book-accordion-content">The person who knows you best may also feel most entitled to decide what is best for you. Where does care become something else?</div>
            </div>
          `
        }
      },
      // Spread 7: 07 — About The Author
      {
        left: {
          header: "07 — About The Author",
          pageNum: "PAGE 17",
          html: `
            <h2 class="book-heading-serif">QUEEN USMAN</h2>
            <p class="book-subheading-serif">A clinical medical student and novelist interested in how people become who they are[cite: 1].</p>
            <p class="book-prose">Queen Usman is a Nigerian clinical medical student and novelist[cite: 1]. She writes fiction about the things that shape people before they fully understand they are being shaped: family, desire, expectation, relationships, power, circumstance, and repetition[cite: 1].</p>
            <p class="book-prose">Her medical training has sharpened her interest in observation, human behavior, and the ways people are shaped by the worlds they inhabit[cite: 1].</p>
          `
        },
        right: {
          header: "Professional Inquiries",
          pageNum: "PAGE 18",
          html: `
            <h3 class="book-subheading-serif" style="font-size: 1.1rem; margin-bottom: 0.8rem;">Contact the Author</h3>
            <p class="book-prose" style="font-size: 0.88rem; margin-bottom: 1rem;">For literary, rights, interview, and professional inquiries:</p>
            
            <form class="book-contact-form" id="authorContactForm">
              <input type="text" id="contactName" class="book-input" placeholder="Name" required />
              <input type="email" id="contactEmail" class="book-input" placeholder="Email *" required />
              <textarea id="contactMessage" class="book-textarea" placeholder="Message ..." required></textarea>
              <button type="submit" id="contactSubmitBtn" class="book-submit-btn">&rarr; Send Message</button>
            </form>
            <div id="contactSuccessState" style="display: none; padding: 1.2rem 0; text-align: center; font-family: var(--font-serif); font-size: 1.2rem; color: var(--ink);">
              ✓ Message sent directly to Queen Usman.
            </div>
          `
        }
      }
    ];

    function openBookExperience() {
      const closed = document.getElementById('closedBook');
      const opened = document.getElementById('openedSpread');
      
      closed.classList.add('opening');
      setTimeout(() => {
        closed.style.display = 'none';
        opened.classList.add('active');
        renderSpread(0);
      }, 400);
    }

    function renderSpread(index) {
      currentSpread = index;
      const data = spreads[currentSpread];

      // Left Page
      document.getElementById('leftHeaderTitle').innerText = data.left.header;
      document.getElementById('leftPageNum').innerText = data.left.pageNum;
      document.getElementById('leftPageContent').innerHTML = data.left.html;
      document.getElementById('leftSpreadNum').innerText = `SPREAD ${currentSpread + 1} OF ${spreads.length}`;

      // Right Page
      document.getElementById('rightHeaderTitle').innerText = data.right.header;
      document.getElementById('rightPageNum').innerText = data.right.pageNum;
      document.getElementById('rightPageContent').innerHTML = data.right.html;
      document.getElementById('rightSpreadNum').innerText = `SPREAD ${currentSpread + 1} OF ${spreads.length}`;

      // Scroll panels back to top
      document.getElementById('leftPage').scrollTop = 0;
      document.getElementById('rightPage').scrollTop = 0;

      // Handle mobile single-page view rotation if needed
      if (window.innerWidth <= 820) {
        // On mobile, show left page initially for this spread
        showMobilePage('left');
      }
    }

    function nextSpread() {
      if (currentSpread < spreads.length - 1) {
        renderSpread(currentSpread + 1);
      }
    }

    function prevSpread() {
      if (currentSpread > 0) {
        renderSpread(currentSpread - 1);
      } else {
        // Return to cover
        const closed = document.getElementById('closedBook');
        const opened = document.getElementById('openedSpread');
        opened.classList.remove('active');
        closed.style.display = 'flex';
        closed.classList.remove('opening');
      }
    }

    function goToSpread(index) {
      if (index >= 0 && index < spreads.length) {
        renderSpread(index);
      }
    }

    function toggleBookAccordion(element) {
      element.classList.toggle('open');
      const icon = element.querySelector('.book-accordion-btn span:last-child');
      icon.textContent = element.classList.contains('open') ? '−' : '+';
    }

    // Contact Form AJAX Handler
    document.addEventListener('submit', function(e) {
      if (e.target && e.target.id === 'authorContactForm') {
        e.preventDefault();
        const btn = document.getElementById('contactSubmitBtn');
        const form = document.getElementById('authorContactForm');
        const success = document.getElementById('contactSuccessState');

        btn.innerHTML = 'Sending...';
        btn.disabled = true;

        fetch('https://formsubmit.co/ajax/usmanshazaan@gmail.com', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('contactName').value,
            email: document.getElementById('contactEmail').value,
            message: document.getElementById('contactMessage').value,
            _subject: 'New Inquiry — Or So She Thought'
          })
        })
        .then(res => res.json())
        .then(data => {
          form.style.display = 'none';
          success.style.display = 'block';
        })
        .catch(err => {
          form.style.display = 'none';
          success.style.display = 'block';
        });
      }
    });

    // Mobile swipe / tap navigation handlers
    function showMobilePage(side) {
      if (window.innerWidth <= 820) {
        const left = document.getElementById('leftPage');
        const right = document.getElementById('rightPage');
        if (side === 'left') {
          left.classList.add('mobile-active');
          right.classList.remove('mobile-active');
        } else {
          right.classList.add('mobile-active');
          left.classList.remove('mobile-active');
        }
      }
    }
  </script>

</body>
</html>
