    function compileBookPages(book) {
      // Measure against an actual rendered .tx element inside the viewport
      bookViewport.innerHTML = '';
      const probePage = document.createElement('article');
      probePage.className = 'pg';
      const probeTx = document.createElement('div');
      probeTx.className = 'tx';
      probePage.appendChild(probeTx);
      bookViewport.appendChild(probePage);

      const parsed = parseBookBlocks(book.body);
      const paginated = paginateBlocks(parsed, probeTx);
      bookViewport.innerHTML = '';

      const compiled = [
        buildTitlePageNode(book, 'i'),
        buildVersoBadgeNode(book, 'ii')
      ];

      paginated.forEach((blocks, idx) => {
        compiled.push(buildTextPageNode(blocks, String(idx + 1)));
      });

      return compiled;
    }

    function isSingleColumnViewport() {
      return window.innerWidth <= 780;
    }

    function getMaxSpreadIndex() {
      const step = isSingleColumnViewport() ? 1 : 2;
      return Math.max(0, Math.ceil((builtPages.length - step) / step));
    }

    function renderSpread() {
      if (!activeBook || builtPages.length === 0) return;

      const single = isSingleColumnViewport();
      const step = single ? 1 : 2;
      const maxIdx = getMaxSpreadIndex();
      spreadIndex = Math.max(0, Math.min(spreadIndex, maxIdx));

      bookViewport.innerHTML = '';
      const start = spreadIndex * step;

      for (let offset = 0; offset < step; offset++) {
        const pageIdx = start + offset;
        const leaf = builtPages[pageIdx];
        if (leaf) {
          const clone = leaf.cloneNode(true);
          clone.classList.remove('fc', 'front', 'back', 'flipped');
          clone.style.visibility = 'visible';
          clone.classList.add(offset === 0 ? 'left-leaf' : 'right-leaf');
          bookViewport.appendChild(clone);
        } else if (!single) {
          const blank = document.createElement('article');
          blank.className = 'pg right-leaf pg-empty';
          bookViewport.appendChild(blank);
        }
      }

      if (single) {
        pageIndicator.textContent = `Page ${start + 1} of ${builtPages.length}`;
      } else {
        const end = Math.min(builtPages.length, start + 2);
        pageIndicator.textContent = start + 1 === end
          ? `Page ${start + 1} of ${builtPages.length}`
          : `Pages ${start + 1}–${end} of ${builtPages.length}`;
      }

      prevSpreadBtn.disabled = spreadIndex <= 0;
      nextSpreadBtn.disabled = spreadIndex >= maxIdx;
    }

    function openBook(bookId, keepSpread = false) {
      const book = ARCHIVE_BOOKS.find(b => b.id === bookId);
      if (!book) return;

      const prevPageNumber = spreadIndex * (isSingleColumnViewport() ? 1 : 2);
      activeBook = book;
      readerStage.classList.add('is-open');
      readerBookLabel.textContent = `${book.shelfTitle} — ${book.shelfSub}`;

      document.querySelectorAll('.volume-card').forEach(card => {
        card.classList.toggle('active', card.dataset.bookId === book.id);
      });

      builtPages = compileBookPages(book);

      if (keepSpread) {
        const newStep = isSingleColumnViewport() ? 1 : 2;
        spreadIndex = Math.floor(prevPageNumber / newStep);
      } else {
        spreadIndex = 0;
      }

      renderSpread();
      if (!keepSpread) {
        readerStage.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function renderShelf() {
      shelfGrid.innerHTML = '';
      ARCHIVE_BOOKS.forEach((book, idx) => {
        const card = document.createElement('div');
        card.className = 'volume-card';
        card.dataset.bookId = book.id;

        card.innerHTML = `
          <div>
            <div class="volume-spine-tag">Volume ${idx + 1} · ${book.spineTitle}</div>
            <h2 class="volume-card-title">${book.shelfTitle}</h2>
            <p class="volume-card-sub">${book.shelfSub}</p>
          </div>
          <button type="button" class="volume-open-btn">Open Volume</button>
        `;

        card.addEventListener('click', () => openBook(book.id, false));
        shelfGrid.appendChild(card);
      });
    }

    prevSpreadBtn.addEventListener('click', () => {
      if (spreadIndex > 0) {
        spreadIndex -= 1;
        renderSpread();
      }
    });

    nextSpreadBtn.addEventListener('click', () => {
      if (spreadIndex < getMaxSpreadIndex()) {
        spreadIndex += 1;
        renderSpread();
      }
    });

    closeReaderBtn.addEventListener('click', () => {
      readerStage.classList.remove('is-open');
      activeBook = null;
      document.querySelectorAll('.volume-card').forEach(card => card.classList.remove('active'));
    });

    window.addEventListener('resize', () => {
      if (!activeBook || !readerStage.classList.contains('is-open')) return;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        openBook(activeBook.id, true);
      }, 140);
    });

    renderShelf();
