class Course extends Object {

  String courseTitleEN;

      quarterTitleEN: data[String_QUARTER_TITLE_EN] ?? '',
      quarterTitleES: data[String_QUARTER_TITLE_ES] ?? '',
      descriptionEN: data[String_DESCRIPTION_EN] ?? '',
      descriptionES: data[String_DESCRIPTION_ES] ?? '',
      thumbnail: data[String_THUMBNAIL] ?? '',
      price: (data[String_PRICE] is int)
          ? (data[String_PRICE] as int).toDouble()
          : data[String_PRICE] ?? 0.0,
      id: docId,

    return {

      String_COURSE_TITLE_EN: courseTitleEN,
      String_COURSE_TITLE_ES: courseTitleES,
      String_QUARTER_TITLE_EN: quarterTitleEN,
      String_QUARTER_TITLE_ES: quarterTitleES,
      String_DESCRIPTION_EN: descriptionEN,
      String_DESCRIPTION_ES: descriptionES,
      String_THUMBNAIL: thumbnail,
      String_PRICE: price,
      String_ID: id,
    };
  }

  String getCourseTitle(String languageCode) {
    if (languageCode == 'es') {
      return courseTitleES;
    }
    return courseTitleEN;
  }

  String getQuarterTitle(String languageCode) {
    if (languageCode == 'es') {
      return quarterTitleES;
    }
    return quarterTitleEN;
  }

  String getDescription(String languageCode) {
    if (languageCode == 'es') {
      return descriptionES;
    }
    return descriptionEN;
  }
}
