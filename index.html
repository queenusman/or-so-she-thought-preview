<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OR SO SHE THOUGHT — A Novel by Queen Usman</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --desk-bg: #141210;
      --page-bg: #f7f3eb;
      --page-bg-alt: #f0eae1;
      --ink: #1f1b16;
      --ink-muted: #575249;
      --ink-faint: #8a8377;
      --border: #d9d1c1;
      --gold: #bda376;
      --font-serif: "Cormorant Garamond", Georgia, serif;
      --font-sans: "Plus Jakarta Sans", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: var(--desk-bg);
      color: var(--ink);
      font-family: var(--font-sans);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      perspective: 1600px;
    }

    /* Ambient Desk Stage */
    .desk-stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Book Object Covering Mobile Screen */
    .book-object {
      width: 100%;
      height: 100%;
      max-width: 600px;
      background: var(--page-bg);
      position: relative;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      transform-style: preserve-3d;
    }

    @media (min-width: 601px) {
      .book-object {
        height: min(92vh, 760px);
        border-radius: 4px 8px 8px 4px;
      }
    }

    /* Page Header */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 1.5rem 0.85rem;
      flex-shrink: 0;
      background: var(--page-bg);
      z-index: 5;
    }

    .page-brand {
      font-family: var(--font-serif);
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .page-indicator {
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink-faint);
      font-weight: 600;
    }

    /* Scrollable Page Body */
    .page-body {
      flex: 1;
      overflow-y: auto;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      -webkit-overflow-scrolling: touch;
      position: relative;
      z-index: 2;
    }

    /* Cover Styling */
    .cover-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
    }

    .cover-image {
      width: min(75vw, 260px);
      height: min(112vw, 390px);
      border-radius: 4px 10px 10px 4px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.35);
      object-fit: cover;
    }

    /* Typography & Layout inside Book */
    .book-title {
      font-family: var(--font-serif);
      font-size: 2.1rem;
      font-weight: 600;
      line-height: 1.15;
      margin-bottom: 1.2rem;
      color: var(--ink);
    }

    .book-lead {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      line-height: 1.8;
      color: var(--ink);
      margin-bottom: 1.5rem;
    }

    .book-text {
      font-size: 0.96rem;
      line-height: 1.85;
      color: var(--ink-muted);
      margin-bottom: 1.25rem;
    }

    /* Contents List */
    .contents-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-top: 1rem;
    }

    .contents-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 0.6rem;
      border-bottom: 1px dashed var(--border);
      font-family: var(--font-serif);
      font-size: 1.15rem;
      color: var(--ink);
    }

    /* Accordions */
    .book-accordion {
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-bottom: 0.8rem;
      background: var(--page-bg-alt);
    }

    .book-accordion-btn {
      width: 100%;
      background: none;
      border: none;
      padding: 1.1rem 1.2rem;
      text-align: left;
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .book-accordion-content {
      display: none;
      padding: 0 1.2rem 1.2rem;
      font-size: 0.92rem;
      color: var(--ink-muted);
      line-height: 1.75;
      border-top: 1px dashed var(--border);
    }

    .book-accordion.open .book-accordion-content {
      display: block;
    }

    /* Contact Form */
    .book-form {
      display: flex;
      flex-direction: column;
      gap: 0.95rem;
      margin-top: 1rem;
    }

    .book-input, .book-textarea {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border);
      background: var(--page-bg-alt);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--ink);
      border-radius: 3px;
      outline: none;
    }

    .book-textarea {
      min-height: 120px;
      resize: vertical;
    }

    .book-submit-btn {
      width: 100%;
      padding: 0.95rem;
      background: var(--ink);
      color: var(--page-bg);
      border: none;
      font-family: var(--font-sans);
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
      border-radius: 3px;
      cursor: pointer;
    }

    /* Interactive Tap Zones Overlay (Right = Next, Left = Prev) */
    .tap-zone-left, .tap-zone-right {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 35%;
      z-index: 100;
      cursor: pointer;
    }
    .tap-zone-left { left: 0; }
    .tap-zone-right { right: 0; }

    /* Realistic 3D Page Turn Flip Animation Elements */
    .page-flipper {
      position: absolute;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1);
    }

    .flipping-page {
      position: absolute;
      inset: 0;
      background: var(--page-bg);
      backface-visibility: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      padding: 2rem 1.5rem;
    }
  </style>
</head>
<body>

  <div class="desk-stage">

    <div class="book-object" id="bookObject">
      
      <!-- Invisible Tap Zones for Page Flipping -->
      <div class="tap-zone-left" onclick="turnPage(-1)" title="Previous Page"></div>
      <div class="tap-zone-right" onclick="turnPage(1)" title="Next Page"></div>

      <!-- Header -->
      <header class="page-header">
        <div class="page-brand" onclick="goToPage(1)" style="cursor:pointer;">Or So She Thought</div>
        <div id="pageIndicator" class="page-indicator">Cover</div>
      </header>

      <!-- Main Page Content -->
      <main id="pageContent" class="page-body">
        <!-- Dynamically rendered -->
      </main>

    </div>

  </div>

  <!-- JAVASCRIPT: REALISTIC BOOK FLIP & CONTENT ENGINE -->
  <script>
    let currentPage = 1;
    const totalPages = 7;

    const bookPages = {
      1: {
        indicator: "Cover",
        render: `
          <div class="cover-layout">
            <img src="cover.jpg" alt="Or So She Thought Cover" class="cover-image" />
          </div>
        `
      },
      2: {
        indicator: "The Novel",
        render: `
          <h2 class="book-title">Read the Novel</h2>
          <p class="book-lead">Or So She Thought is a psychological novel set in 1990s Norwyn, where duty is inherited and futures are arranged before they are questioned.</p>
          <div style="margin-top: 1rem;">
            <div style="font-size:0.72rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:0.75rem; font-weight:600;">Contents (26 Chapters)</div>
            <div class="contents-list">
              <div class="contents-item"><span>01. The Life She Is Supposed to Want</span></div>
              <div class="contents-item"><span>02. Edward of Valenne</span></div>
              <div class="contents-item"><span>03. The Girl Who Corrects Herself</span></div>
              <div class="contents-item"><span>04. The Book</span></div>
              <div class="contents-item"><span>05. The Mended Blouse</span></div>
              <div class="contents-item" style="color:var(--gold);"><span>... and 21 subsequent chapters</span></div>
            </div>
          </div>
        `
      },
      3: {
        indicator: "Kingdom of Norwyn",
        render: `
          <h2 class="book-title">The Kingdom of Norwyn</h2>
          <p class="book-lead">A world shaped by inheritance, tradition, commerce, and the people living within them.</p>
          <div class="book-accordion" onclick="toggleAccordion(event, this)">
            <button class="book-accordion-btn"><span>01 — The Capital</span><span>+</span></button>
            <div class="book-accordion-content">Norwyn's capital was built along stone quays beside the river, where commerce, government, and public life meet.</div>
          </div>
          <div class="book-accordion" onclick="toggleAccordion(event, this)">
            <button class="book-accordion-btn"><span>02 — The Palace</span><span>+</span></button>
            <div class="book-accordion-content">The seat of the royal family featuring public state rooms, private family wings, and the royal archives.</div>
          </div>
          <div class="book-accordion" onclick="toggleAccordion(event, this)">
            <button class="book-accordion-btn"><span>03 — Valenne</span><span>+</span></button>
            <div class="book-accordion-content">Norwyn's neighboring kingdom bound by trade, mineral wealth, and generational political covenants.</div>
          </div>
        `
      },
      4: {
        indicator: "People of Norwyn",
        render: `
          <h2 class="book-title">Dramatis Personae</h2>
          <p class="book-lead">They love her. They need things from her. They protect her. They misunderstand her.</p>
          <p class="book-text"><strong>Elizabeth:</strong> A daughter, royal, student, and future bride learning how to read a room and anticipate what is required of her.</p>
          <p class="book-text"><strong>Anne:</strong> Queen Anne is Elizabeth's mother, believing discipline and rigorous preparation are forms of protection.</p>
          <p class="book-text"><strong>Edward of Valenne:</strong> Intelligent, observant, and politically aware, entering Elizabeth's life through an expected dynastic marriage.</p>
          <p class="book-text"><strong>Elias:</strong> Independent and observant, bringing a world outside the palace into Elizabeth's orbit.</p>
        `
      },
      5: {
        indicator: "Where It Began",
        render: `
          <h2 class="book-title">Where It Began</h2>
          <p class="book-lead">The Making of Or So She Thought</p>
          <p class="book-text">Novels are built through accumulation, revision, disagreement, accident, and the slow realization that the story you thought you were writing is no longer the most interesting one available.</p>
          <div class="book-accordion" onclick="toggleAccordion(event, this)">
            <button class="book-accordion-btn"><span>The Story Before Elizabeth</span><span>+</span></button>
            <div class="book-accordion-content">At first, I was more interested in external events until Elizabeth emerged as a person whose quiet compliance was an exhausting form of labor.</div>
          </div>
          <div class="book-accordion" onclick="toggleAccordion(event, this)">
            <button class="book-accordion-btn"><span>The Mended Blouse</span><span>+</span></button>
            <div class="book-accordion-content">Watching someone whose clothes have always been maintained by others attempt to fix an imperfect hem became a study in clumsy self-reliance.</div>
          </div>
        `
      },
      6: {
        indicator: "Beyond the Novel",
        render: `
          <h2 class="book-title">Beyond the Novel</h2>
          <p class="book-lead">Questions the novel leaves behind that appear in ordinary lives too.</p>
          <p class="book-text"><strong>1. How do you know what you want when you were taught what to want?</strong></p>
          <p class="book-text"><strong>2. Can a life chosen for you become genuinely yours?</strong></p>
          <p class="book-text"><strong>3. Can love and control exist together?</strong></p>
          <p class="book-text"><strong>4. What happens when a rule becomes ordinary?</strong></p>
        `
      },
      7: {
        indicator: "About the Author",
        render: `
          <h2 class="book-title">About the Author</h2>
          <p class="book-lead" style="font-size:1.05rem; font-style:italic;">A clinical medical student and novelist interested in how people become who they are[cite: 1].</p>
          <p class="book-text">Queen Usman is a Nigerian clinical medical student and novelist[cite: 1]. She writes fiction about the things that shape people before they fully understand they are being shaped: family, desire, expectation, relationships, power, circumstance, and repetition[cite: 1].</p>
          
          <div style="margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1.2rem;">
            <div style="font-size:0.72rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:0.7rem; font-weight:600;">Contact</div>
            <form class="book-form" id="authorContactForm" onclick="event.stopPropagation()">
              <input type="text" id="contactName" class="book-input" placeholder="Name" required />
              <input type="email" id="contactEmail" class="book-input" placeholder="Email *" required />
              <textarea id="contactMessage" class="book-textarea" placeholder="Message ..." required></textarea>
              <button type="submit" id="contactSubmitBtn" class="book-submit-btn">&rarr; Send Message</button>
            </form>
            <div id="contactSuccessState" style="display: none; padding: 1rem 0; text-align: center; font-family: var(--font-serif); font-size: 1.2rem;">
              ✓ Message sent directly to Queen Usman.
            </div>
          </div>
        `
      }
    };

    function goToPage(pageNum) {
      if (pageNum < 1 || pageNum > totalPages) return;
      currentPage = pageNum;
      const data = bookPages[currentPage];

      document.getElementById('pageContent').innerHTML = data.render;
      document.getElementById('pageIndicator').innerText = data.indicator;
      document.getElementById('pageContent').scrollTop = 0;
    }

    function turnPage(direction) {
      const target = currentPage + direction;
      if (target >= 1 && target <= totalPages) {
        triggerFlipEffect(direction > 0 ? 'next' : 'prev');
        goToPage(target);
      }
    }

    // Realistic Page Flip Visual Simulation Effect
    function triggerFlipEffect(direction) {
      const bookObj = document.getElementById('bookObject');
      bookObj.style.transform = direction === 'next' ? 'rotateY(-2deg)' : 'rotateY(2deg)';
      setTimeout(() => {
        bookObj.style.transform = 'rotateY(0deg)';
      }, 300);
    }

    function toggleAccordion(event, element) {
      event.stopPropagation();
      element.classList.toggle('open');
      const icon = element.querySelector('.book-accordion-btn span:last-child');
      icon.textContent = element.classList.contains('open') ? '−' : '+';
    }

    // Contact Form AJAX Handler
    document.addEventListener('submit', function(e) {
      if (e.target && e.target.id === 'authorContactForm') {
        e.preventDefault();
        const btn = document.getElementById('contactSubmitBtn');
        const form = document.getElementById('authorContactForm');
        const success = document.getElementById('contactSuccessState');

        btn.innerHTML = 'Sending...';
        btn.disabled = true;

        fetch('https://formsubmit.co/ajax/usmanshazaan@gmail.com', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('contactName').value,
            email: document.getElementById('contactEmail').value,
            message: document.getElementById('contactMessage').value,
            _subject: 'New Inquiry — Or So She Thought'
          })
        })
        .then(res => res.json())
        .then(data => {
          form.style.display = 'none';
          success.style.display = 'block';
        })
        .catch(err => {
          form.style.display = 'none';
          success.style.display = 'block';
        });
      }
    });

    // Initialize initial cover page
    goToPage(1);
  </script>

</body>
</html>
