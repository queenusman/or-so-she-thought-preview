const String String_COURSE_TITLE_EN = "courseTitleEN";
const String String_COURSE_TITLE_ES = "courseTitleES";
const String String_QUARTER_TITLE_EN = "quarterTitleEN";
const String String_QUARTER_TITLE_ES = "quarterTitleES";
const String String_DESCRIPTION_EN = "descriptionEN";
const String String_DESCRIPTION_ES = "descriptionES";
const String String_THUMBNAIL = "thumbnail";
const String String_PRICE = "price";
const String String_ID = "id";

class Course extends Object {
  String courseId;
  String courseTitleEN;
  String courseTitleES;
  String quarterTitleEN;
  String quarterTitleES;
  String descriptionEN;
  String descriptionES;
  String thumbnail;
  double price;
  String id;

  Course({
    required this.courseId,
    required this.courseTitleEN,
    required this.courseTitleES,
    required this.quarterTitleEN,
    required this.quarterTitleES,
    required this.descriptionEN,
    required this.descriptionES,
    required this.thumbnail,
    required this.price,
    required this.id,
  });

  factory Course.fromFirestore(Map<String, dynamic> data, String docId) {
    return Course(
      courseId: data[String_COURSE_ID] ?? '',
      courseTitleEN: data[String_COURSE_TITLE_EN] ?? '',
      courseTitleES: data[String_COURSE_TITLE_ES] ?? '',
      quarterTitleEN: data[String_QUARTER_TITLE_EN] ?? '',
      quarterTitleES: data[String_QUARTER_TITLE_ES] ?? '',
      descriptionEN: data[String_DESCRIPTION_EN] ?? '',
      descriptionES: data[String_DESCRIPTION_ES] ?? '',
      thumbnail: data[String_THUMBNAIL] ?? '',
      price: (data[String_PRICE] is int)
          ? (data[String_PRICE] as int).toDouble()
          : data[String_PRICE] ?? 0.0,
      id: docId,
    );
  }

  Map<String, dynamic> toMap() {
    return {
      String_COURSE_ID: courseId,
      String_COURSE_TITLE_EN: courseTitleEN,
      String_COURSE_TITLE_ES: courseTitleES,
      String_QUARTER_TITLE_EN: quarterTitleEN,
      String_QUARTER_TITLE_ES: quarterTitleES,
      String_DESCRIPTION_EN: descriptionEN,
      String_DESCRIPTION_ES: descriptionES,
      String_THUMBNAIL: thumbnail,
      String_PRICE: price,
      String_ID: id,
    };
  }

  String getCourseTitle(String languageCode) {
    if (languageCode == 'es') {
      return courseTitleES;
    }
    return courseTitleEN;
  }

  String getQuarterTitle(String languageCode) {
    if (languageCode == 'es') {
      return quarterTitleES;
    }
    return quarterTitleEN;
  }

  String getDescription(String languageCode) {
    if (languageCode == 'es') {
      return descriptionES;
    }
    return descriptionEN;
  }
}
