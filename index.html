<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OR SO SHE THOUGHT — A Novel by Queen Usman</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-page: #fbf9f4;
      --ink: #1f1b16;
      --ink-muted: #575249;
      --ink-faint: #8a8377;
      --border: #e2dcd0;
      --gold: #bda376;
      --font-serif: "Cormorant Garamond", Georgia, serif;
      --font-sans: "Plus Jakarta Sans", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: var(--bg-page);
      color: var(--ink);
      font-family: var(--font-sans);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Full-Screen Book Spread Container */
    .book-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 16px) 1.25rem env(safe-area-inset-bottom, 16px) 1.25rem;
      background: var(--bg-page);
      position: relative;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.03);
    }

    /* Top Page Header */
    .book-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
      flex-shrink: 0;
    }

    .book-title-mini {
      font-family: var(--font-serif);
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-faint);
      cursor: pointer;
    }

    .book-page-indicator {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink-faint);
      font-weight: 600;
    }

    /* Main Page Content Area (Scrollable single side of book) */
    .book-page-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 0.25rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      -webkit-overflow-scrolling: touch;
    }

    /* Cover View Style inside Page */
    .cover-page-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
      gap: 1.5rem;
    }

    .book-cover-thumb {
      width: 180px;
      height: 270px;
      border-radius: 3px 8px 8px 3px;
      box-shadow: 0 16px 30px rgba(0,0,0,0.25);
      object-fit: cover;
      cursor: pointer;
    }

    .cover-motto {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-style: italic;
      line-height: 1.4;
      color: var(--ink);
      max-width: 320px;
    }

    /* Section Typography inside Book */
    .page-chapter-title {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 1.2rem;
      color: var(--ink);
    }

    .page-lead {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      line-height: 1.75;
      color: var(--ink);
      margin-bottom: 1.5rem;
    }

    .page-body-text {
      font-size: 0.95rem;
      line-height: 1.75;
      color: var(--ink-muted);
      margin-bottom: 1.2rem;
    }

    /* Accordions & Cards inside Book */
    .book-accordion {
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-bottom: 0.8rem;
      background: rgba(255,255,255,0.5);
    }

    .book-accordion-btn {
      width: 100%;
      background: none;
      border: none;
      padding: 1rem 1.1rem;
      text-align: left;
      font-family: var(--font-serif);
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .book-accordion-content {
      display: none;
      padding: 0 1.1rem 1.1rem;
      font-size: 0.9rem;
      color: var(--ink-muted);
      line-height: 1.7;
      border-top: 1px dashed var(--border);
    }

    .book-accordion.open .book-accordion-content {
      display: block;
    }

    /* Contact Form inside Book Page */
    .book-form {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      margin-top: 1rem;
    }

    .book-input, .book-textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.7);
      font-family: var(--font-sans);
      font-size: 0.92rem;
      color: var(--ink);
      border-radius: 3px;
      outline: none;
    }

    .book-textarea {
      min-height: 110px;
      resize: vertical;
    }

    .book-submit-btn {
      width: 100%;
      padding: 0.9rem;
      background: var(--ink);
      color: var(--bg-page);
      border: none;
      font-family: var(--font-sans);
      font-size: 0.78rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
      border-radius: 3px;
      cursor: pointer;
    }

    /* Bottom Page Footer Navigation */
    .book-footer-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 0.85rem;
      flex-shrink: 0;
    }

    .nav-page-btn {
      background: none;
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      font-family: var(--font-sans);
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      border-radius: 2px;
    }

    .nav-page-btn:active {
      background: var(--border);
    }
  </style>
</head>
<body>

  <div class="book-container">
    <!-- Header -->
    <header class="book-header">
      <div class="book-title-mini" onclick="goToPage(1)">Or So She Thought</div>
      <div id="page-counter" class="book-page-indicator">Cover</div>
    </header>

    <!-- Page Body -->
    <main id="book-content-area" class="book-page-body">
      <!-- Rendered dynamically -->
    </main>

    <!-- Footer Navigation -->
    <footer class="book-footer-nav">
      <button id="prev-btn" class="nav-page-btn" onclick="changePage(-1)">← Prev</button>
      <span id="footer-page-num" style="font-size:0.75rem; color:var(--ink-faint);">1 / 7</span>
      <button id="next-btn" class="nav-page-btn" onclick="changePage(1)">Next →</button>
    </footer>
  </div>

  <!-- JAVASCRIPT: IMMERSIVE BOOK ENGINE -->
  <script>
    let currentBookPage = 1;

    const pages = {
      1: {
        indicator: "Cover",
        render: `
          <div class="cover-page-layout">
            <img src="cover.jpg" alt="Or So She Thought Cover" class="book-cover-thumb" onclick="goToPage(2)" />
            <p class="cover-motto">"She was never forbidden to choose. She was simply taught what the right choice looked like."</p>
            <button class="nav-page-btn" style="padding: 0.75rem 2rem; background: var(--ink); color: var(--bg-page); border: none;" onclick="goToPage(2)">Open Book →</button>
          </div>
        `
      },
      2: {
        indicator: "The Novel",
        render: `
          <h2 class="page-chapter-title">Read the Novel</h2>
          <p class="page-lead">Or So She Thought is a psychological novel set in 1990s Norwyn, where duty is inherited and futures are arranged before they are questioned.</p>
          <div style="margin-top: 1rem;">
            <div style="font-size:0.72rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:0.75rem; font-weight:600;">Contents (26 Chapters)</div>
            <div style="display:flex; flex-direction:column; gap:0.5rem;">
              <div style="font-family:var(--font-serif); font-size:1rem; padding:0.3rem 0; border-bottom:1px dashed var(--border);">01. The Life She Is Supposed to Want</div>
              <div style="font-family:var(--font-serif); font-size:1rem; padding:0.3rem 0; border-bottom:1px dashed var(--border);">02. Edward of Valenne</div>
              <div style="font-family:var(--font-serif); font-size:1rem; padding:0.3rem 0; border-bottom:1px dashed var(--border);">03. The Girl Who Corrects Herself</div>
              <div style="font-family:var(--font-serif); font-size:1.0rem; padding:0.3rem 0; border-bottom:1px dashed var(--border);">04. The Book</div>
              <div style="font-family:var(--font-serif); font-size:1.0rem; padding:0.35rem 0; color:var(--gold);">... and 22 subsequent chapters</div>
            </div>
          </div>
        `
      },
      3: {
        indicator: "Kingdom of Norwyn",
        render: `
          <h2 class="page-chapter-title">The Kingdom of Norwyn</h2>
          <p class="page-lead">A world shaped by inheritance, tradition, commerce, and the people living within them.</p>
          <div class="book-accordion" onclick="toggleAccordion(this)">
            <button class="book-accordion-btn"><span>01 — The Capital</span><span>+</span></button>
            <div class="book-accordion-content">Norwyn's capital was built along stone quays beside the river, where commerce, government, and public life meet.</div>
          </div>
          <div class="book-accordion" onclick="toggleAccordion(this)">
            <button class="book-accordion-btn"><span>02 — The Palace</span><span>+</span></button>
            <div class="book-accordion-content">The seat of the royal family featuring public state rooms, private family wings, and the royal archives.</div>
          </div>
          <div class="book-accordion" onclick="toggleAccordion(this)">
            <button class="book-accordion-btn"><span>03 — Valenne</span><span>+</span></button>
            <div class="book-accordion-content">Norwyn's neighboring kingdom bound by trade, mineral wealth, and generational political covenants.</div>
          </div>
        `
      },
      4: {
        indicator: "People of Norwyn",
        render: `
          <h2 class="page-chapter-title">Dramatis Personae</h2>
          <p class="page-lead">They love her. They need things from her. They protect her. They misunderstand her.</p>
          <p class="page-body-text"><strong>Elizabeth:</strong> A daughter, royal, student, and future bride learning how to read a room and anticipate what is required of her.</p>
          <p class="page-body-text"><strong>Anne:</strong> Queen Anne is Elizabeth's mother, believing discipline and rigorous preparation are forms of protection.</p>
          <p class="page-body-text"><strong>Edward of Valenne:</strong> Intelligent, observant, and politically aware, entering Elizabeth's life through an expected dynastic marriage.</p>
          <p class="page-body-text"><strong>Elias:</strong> Independent and observant, bringing a world outside the palace into Elizabeth's orbit.</p>
        `
      },
      5: {
        indicator: "Where It Began",
        render: `
          <h2 class="page-chapter-title">Where It Began</h2>
          <p class="page-lead">The Making of Or So She Thought</p>
          <p class="page-body-text">Novels are built through accumulation, revision, disagreement, accident, and the slow realization that the story you thought you were writing is no longer the most interesting one available.</p>
          <div class="book-accordion" onclick="toggleAccordion(this)">
            <button class="book-accordion-btn"><span>The Story Before Elizabeth</span><span>+</span></button>
            <div class="book-accordion-content">At first, I was more interested in external events until Elizabeth emerged as a person whose quiet compliance was an exhausting form of labor.</div>
          </div>
          <div class="book-accordion" onclick="toggleAccordion(this)">
            <button class="book-accordion-btn"><span>The Mended Blouse</span><span>+</span></button>
            <div class="book-accordion-content">Watching someone whose clothes have always been maintained by others attempt to fix an imperfect hem became a study in clumsy self-reliance.</div>
          </div>
        `
      },
      6: {
        indicator: "Beyond the Novel",
        render: `
          <h2 class="page-chapter-title">Beyond the Novel</h2>
          <p class="page-lead">Questions the novel leaves behind that appear in ordinary lives too.</p>
          <p class="page-body-text"><strong>1. How do you know what you want when you were taught what to want?</strong></p>
          <p class="page-body-text"><strong>2. Can a life chosen for you become genuinely yours?</strong></p>
          <p class="page-body-text"><strong>3. Can love and control exist together?</strong></p>
          <p class="page-body-text"><strong>4. What happens when a rule becomes ordinary?</strong></p>
        `
      },
      7: {
        indicator: "About the Author",
        render: `
          <h2 class="page-chapter-title">About the Author</h2>
          <p class="page-lead" style="font-size:1rem; font-style:italic;">A clinical medical student and novelist interested in how people become who they are.</p>
          <p class="page-body-text">Queen Usman is a Nigerian clinical medical student and novelist. She writes fiction about the things that shape people before they fully understand they are being shaped: family, desire, expectation, relationships, power, circumstance, and repetition.</p>
          
          <div style="margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1.2rem;">
            <div style="font-size:0.72rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:0.7rem; font-weight:600;">Contact</div>
            <form class="book-form" id="authorContactForm">
              <input type="text" id="contactName" class="book-input" placeholder="Name" required />
              <input type="email" id="contactEmail" class="book-input" placeholder="Email *" required />
              <textarea id="contactMessage" class="book-textarea" placeholder="Message ..." required></textarea>
              <button type="submit" id="contactSubmitBtn" class="book-submit-btn">&rarr; Send Message</button>
            </form>
            <div id="contactSuccessState" style="display: none; padding: 1rem 0; text-align: center; font-family: var(--font-serif); font-size: 1.15rem;">
              ✓ Message sent directly to Queen Usman.
            </div>
          </div>
        `
      }
    };

    function goToPage(pageNum) {
      currentBookPage = pageNum;
      const data = pages[currentBookPage];

      document.getElementById('book-content-area').innerHTML = data.render;
      document.getElementById('page-counter').innerText = data.indicator;
      document.getElementById('footer-page-num').innerText = `${currentBookPage} / 7`;

      document.getElementById('prev-btn').style.visibility = (currentBookPage === 1) ? 'hidden' : 'visible';
      document.getElementById('next-btn').style.visibility = (currentBookPage === 7) ? 'hidden' : 'visible';

      document.getElementById('book-content-area').scrollTop = 0;
    }

    function changePage(direction) {
      const target = currentBookPage + direction;
      if (target >= 1 && target <= 7) {
        goToPage(target);
      }
    }

    function toggleAccordion(element) {
      element.classList.toggle('open');
      const icon = element.querySelector('.book-accordion-btn span:last-child');
      icon.textContent = element.classList.contains('open') ? '−' : '+';
    }

    // Contact Form AJAX Handler
    document.addEventListener('submit', function(e) {
      if (e.target && e.target.id === 'authorContactForm') {
        e.preventDefault();
        const btn = document.getElementById('contactSubmitBtn');
        const form = document.getElementById('authorContactForm');
        const success = document.getElementById('contactSuccessState');

        btn.innerHTML = 'Sending...';
        btn.disabled = true;

        fetch('https://formsubmit.co/ajax/usmanshazaan@gmail.com', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('contactName').value,
            email: document.getElementById('contactEmail').value,
            message: document.getElementById('contactMessage').value,
            _subject: 'New Inquiry — Or So She Thought'
          })
        })
        .then(res => res.json())
        .then(data => {
          form.style.display = 'none';
          success.style.display = 'block';
        })
        .catch(err => {
          form.style.display = 'none';
          success.style.display = 'block';
        });
      }
    });

    // Initialize Cover
    goToPage(1);
  </script>

</body>
</html>
