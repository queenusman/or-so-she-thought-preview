<script>
(function () {
  var d = document.documentElement;
  try {
    if (!sessionStorage.getItem('quEntered')) d.classList.add('qu-intro-on');
    if (localStorage.getItem('novel_theme_mode') === 'ivory') d.classList.add('qu-intro-ivory');
  } catch (e) {
    d.classList.add('qu-intro-on');
  }
})();
</script>

<!-- ═════════ PART 2 · CSS (Add inside <style> of index.html) ═════════ -->
<style>
.qu-intro {
  --qu-bg: #2B2A2F;
  --qu-plum: #3E3D43;
  --qu-panel: rgba(73, 71, 78, 0.78);
  --qu-border: #625B64;
  --qu-accent: #E2D0D4;
  --qu-secondary: #8E7D8A;
  --qu-text: #F8F7F5;
  --qu-text-muted: #C5BAC1;
  --qu-reveal: #3E3D43;

  display: none;
  position: fixed;
  inset: 0;
  z-index: 99999;
  height: 100vh;
  height: 100dvh;
  background: var(--qu-bg);
  overflow: hidden;
  color: var(--qu-text);
  font-family: 'Cormorant Garamond', Georgia, serif;
  -webkit-font-smoothing: antialiased;
  transition: opacity 1.1s ease, visibility 0s linear 1.1s;
}
html.qu-intro-ivory .qu-intro {
  --qu-reveal: #F8F7F5;
}
html.qu-intro-on .qu-intro { display: block; }
html.qu-intro-on { overflow: hidden; }
.qu-intro.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
.qu-intro.is-skipping { transition-duration: 0.6s; }

/* ── Photograph & Atmospheric Grade ── */
.qu-stage {
  position: absolute;
  inset: 0;
  transition: transform 2.6s cubic-bezier(0.4, 0, 0.2, 1);
}
.is-opening .qu-stage { transform: scale(1.24); }

.qu-scene {
  position: absolute;
  inset: 0;
  animation: quFade 2s ease-out both, quDrift 40s ease-in-out infinite alternate;
}
@keyframes quFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes quDrift { from { transform: scale(1); } to { transform: scale(1.035) translate(-0.4%, -0.5%); } }

.qu-frame {
  position: absolute;
  overflow: hidden;
  background:
    radial-gradient(ellipse 38% 62% at 50% 56%, rgba(142, 125, 138, 0.36), transparent 72%),
    linear-gradient(180deg, #3E3D43 0%, #26252A 100%);
}
.qu-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  opacity: 0;
  transition: opacity 1.4s ease;
  filter: saturate(0.84) contrast(1.08) brightness(0.9);
}
.is-loaded .qu-photo { opacity: 1; }

/* Colour grade: charcoal plum shadows, rose-champagne highlights */
.qu-tint {
  position: absolute;
  inset: 0;
  pointer-events: none;
  mix-blend-mode: multiply;
  background: linear-gradient(rgba(62, 61, 67, 0.32), rgba(38, 37, 42, 0.52));
}
.qu-glow-grade {
  position: absolute;
  inset: 0;
  pointer-events: none;
  mix-blend-mode: soft-light;
  background: radial-gradient(ellipse at 50% 54%, rgba(226, 208, 212, 0.42), transparent 68%);
}

/* Lamps: crisp bulb + soft rose-amber halo flickered by JS */
.qu-glow, .qu-bulb {
  position: absolute;
  pointer-events: none;
  mix-blend-mode: screen;
  border-radius: 50%;
  aspect-ratio: 1 / 1;
  transform: translate(-50%, -50%);
}
.qu-glow {
  background: radial-gradient(closest-side, rgba(242, 214, 206, 0.48), rgba(214, 182, 188, 0.18) 38%, rgba(142, 125, 138, 0.05) 70%, transparent);
}
.qu-bulb {
  background: radial-gradient(closest-side, #F8F7F5 0%, #F4E4E7 32%, rgba(226, 208, 212, 0.6) 60%, transparent 100%);
}

/* Calibration helper (?calibrate) */
.is-calibrating .qu-content,
.is-calibrating .qu-skip,
.is-calibrating .qu-vignette { display: none; }
.is-calibrating .qu-scene { animation: none; }
.is-calibrating { cursor: crosshair; }
.qu-cal {
  position: absolute;
  left: 1rem;
  bottom: 1rem;
  z-index: 5;
  max-width: min(640px, calc(100% - 2rem));
  background: rgba(43, 42, 47, 0.94);
  border: 1px solid var(--qu-accent);
  border-radius: 8px;
  padding: 0.9rem 1rem;
  font: 13px/1.55 ui-monospace, Menlo, Consolas, monospace;
  color: var(--qu-text);
  user-select: text;
  cursor: auto;
  word-break: break-all;
}
.qu-dot {
  position: absolute;
  width: 14px;
  height: 14px;
  border: 2px solid var(--qu-accent);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
.qu-wash {
  position: absolute;
  inset: 0;
  pointer-events: none;
  mix-blend-mode: screen;
  background: radial-gradient(ellipse at 50% 50%, rgba(226, 208, 212, 0.14), transparent 75%);
  opacity: 0.5;
}

/* Doorway seam & threshold flood on ENTER */
.qu-door {
  position: absolute;
  overflow: hidden;
  pointer-events: none;
  mix-blend-mode: screen;
}
.qu-slit {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 1.1%;
  transform: translateX(-50%);
  filter: blur(2px);
  opacity: 0.34;
  background: radial-gradient(ellipse at center, #F8F7F5 0%, #EFE2E5 55%, #C79EAF 100%);
  transition: width 1.7s cubic-bezier(0.55, 0, 0.2, 1), opacity 1.2s ease 0.2s;
  animation: quSeam 5s ease-in-out infinite alternate;
}
@keyframes quSeam { from { opacity: 0.24; } to { opacity: 0.44; } }
.is-opening .qu-slit { width: 100%; opacity: 1; animation: none; }

.qu-orb {
  position: absolute;
  pointer-events: none;
  border-radius: 50%;
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.6);
  background: radial-gradient(closest-side, #F8F7F5 0%, rgba(244, 232, 235, 0.96) 42%, rgba(226, 208, 212, 0) 100%);
  transition: transform 1.6s cubic-bezier(0.5, 0, 0.3, 1) 0.35s, opacity 0.9s ease 0.25s;
}
.is-opening .qu-orb { opacity: 1; transform: translate(-50%, -50%) scale(var(--os, 16)); }

.qu-vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(rgba(34, 33, 38, 0.76), transparent 32%, transparent 66%, rgba(34, 33, 38, 0.8)),
    radial-gradient(ellipse at 50% 50%, transparent 54%, rgba(34, 33, 38, 0.68) 100%);
}

.qu-motes {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}
.qu-motes span {
  position: absolute;
  bottom: -10px;
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  background: rgba(226, 208, 212, 0.85);
  box-shadow: 0 0 6px rgba(226, 208, 212, 0.65);
  opacity: 0;
  animation: quMote var(--d) linear var(--dl) infinite;
}
@keyframes quMote {
  0% { transform: translate(0, 0); opacity: 0; }
  15% { opacity: var(--o); }
  85% { opacity: var(--o); }
  100% { transform: translate(var(--x), -105vh); opacity: 0; }
}

.qu-grain {
  position: absolute;
  inset: -20%;
  pointer-events: none;
  opacity: 0.055;
  mix-blend-mode: overlay;
  animation: quGrain 0.8s steps(1) infinite;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
@keyframes quGrain {
  0% { transform: translate(0, 0); }
  20% { transform: translate(-4%, 3%); }
  40% { transform: translate(3%, -5%); }
  60% { transform: translate(-3%, -2%); }
  80% { transform: translate(5%, 4%); }
}

/* Dissolve flash synced to active site theme (#3E3D43 dark or #F8F7F5 ivory) */
.qu-flash {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(ellipse at 50% 55%, #F8F7F5 0%, var(--qu-accent) 48%, var(--qu-reveal) 100%);
  transition: opacity 1s ease 0.7s;
}
.is-opening .qu-flash { opacity: 1; }

/* ── Typography & Controls (Matched to Main Site) ── */
.qu-content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  text-align: center;
  padding: clamp(3rem, 10vh, 6.5rem) 2rem clamp(3.25rem, 11vh, 6.5rem);
  transition: opacity 0.9s ease, transform 0.9s ease;
}
.is-leaving .qu-content,
.is-skipping .qu-content {
  opacity: 0;
  transform: translateY(-8px);
  pointer-events: none;
}

.qu-crest {
  width: 44px;
  height: 44px;
  margin: 0 auto 1.4rem;
  border-radius: 10px;
  border: 1px solid var(--qu-border);
  background: var(--qu-panel);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--qu-accent);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
  animation: quRise 2s cubic-bezier(0.2, 0.6, 0.2, 1) 0.9s both;
}

.qu-eyebrow {
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--qu-secondary);
  margin: 0 0 0.85rem;
  animation: quRise 2s cubic-bezier(0.2, 0.6, 0.2, 1) 1.1s both;
}

.qu-name {
  margin: 0;
  font-family: 'Cinzel', Georgia, serif;
  font-weight: 400;
  font-size: clamp(2.1rem, 6.8vw, 4.4rem);
  letter-spacing: 0.26em;
  padding-left: 0.26em;
  color: var(--qu-text);
  text-shadow: 0 2px 28px rgba(0, 0, 0, 0.72);
  animation: quRise 2.2s cubic-bezier(0.2, 0.6, 0.2, 1) 1.3s both;
}

.qu-ornament {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.85rem;
  margin: 1.4rem auto 1.25rem;
  animation: quRule 2s ease 1.9s both;
}
.qu-ornament span.line {
  width: clamp(44px, 7vw, 84px);
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--qu-border), transparent);
}
.qu-ornament span.star {
  font-size: 11px;
  color: var(--qu-accent);
  line-height: 1;
}

.qu-tag {
  margin: 0;
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-style: italic;
  font-weight: 400;
  font-size: clamp(1.15rem, 2.5vw, 1.55rem);
  letter-spacing: 0.08em;
  color: var(--qu-text-muted);
  text-shadow: 0 2px 18px rgba(0, 0, 0, 0.85);
  animation: quRise 2.2s ease 2.3s both;
}

.qu-enter {
  background: var(--qu-panel);
  border: 1px solid var(--qu-border);
  border-radius: 8px;
  backdrop-filter: blur(8px);
  cursor: pointer;
  color: var(--qu-accent);
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  padding: 0.9rem 1.85rem;
  display: inline-flex;
  gap: 0.65rem;
  align-items: center;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.28);
  transition: border-color 0.35s ease, color 0.35s ease, background-color 0.35s ease, transform 0.35s ease;
  animation: quRise 2s ease 3s both;
}
.qu-enter:hover,
.qu-enter:focus-visible {
  border-color: var(--qu-accent);
  color: var(--qu-text);
  background: rgba(82, 78, 87, 0.92);
  transform: translateY(-1px);
}
.qu-enter:focus-visible,
.qu-skip:focus-visible {
  outline: 1px solid var(--qu-accent);
  outline-offset: 4px;
}

.qu-skip {
  position: absolute;
  right: max(1.4rem, env(safe-area-inset-right));
  bottom: max(1.2rem, env(safe-area-inset-bottom));
  background: var(--qu-panel);
  border: 1px solid var(--qu-border);
  border-radius: 8px;
  backdrop-filter: blur(8px);
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--qu-text-muted);
  padding: 0.5rem 0.9rem;
  transition: color 0.3s ease, border-color 0.3s ease, opacity 0.9s ease;
  animation: quSkip 2s ease 2.8s both;
}
.qu-skip:hover {
  color: var(--qu-text);
  border-color: var(--qu-accent);
}
.is-leaving .qu-skip,
.is-skipping .qu-skip {
  opacity: 0;
  pointer-events: none;
}

@keyframes quRise {
  from { opacity: 0; transform: translateY(14px); filter: blur(4px); }
  to { opacity: 1; transform: none; filter: none; }
}
@keyframes quRule {
  from { opacity: 0; transform: scaleX(0.6); }
  to { opacity: 1; transform: scaleX(1); }
}
@keyframes quSkip { from { opacity: 0; } to { opacity: 1; } }

@media (max-width: 600px) {
  .qu-name { letter-spacing: 0.18em; padding-left: 0.18em; }
  .qu-tag { letter-spacing: 0.05em; }
}
@media (max-height: 520px) {
  .qu-crest { display: none; }
  .qu-ornament { margin: 0.75rem auto; }
}

@media (prefers-reduced-motion: reduce) {
  .qu-scene { animation: quFade 1s ease-out both; }
  .qu-crest, .qu-eyebrow, .qu-name, .qu-tag, .qu-enter, .qu-skip, .qu-ornament { animation: quSkip 1s ease both; }
  .is-opening .qu-stage { transform: none; }
  .qu-slit { animation: none; transition: opacity 0.5s ease; }
  .is-opening .qu-slit { width: 100%; }
  .qu-orb, .is-opening .qu-orb { transform: translate(-50%, -50%) scale(var(--os, 16)); transition: opacity 0.5s ease; }
  .qu-flash { transition-delay: 0s; transition-duration: 0.5s; }
  .qu-motes { display: none; }
  .qu-grain { animation: none; }
  .qu-intro, .qu-intro.is-skipping { transition: opacity 0.5s ease, visibility 0s linear 0.5s; }
  .qu-content { transition: opacity 0.4s ease; transform: none !important; }
}
</style>
</head>

<!-- ═════════ PART 4 · JAVASCRIPT (Add before </body> of index.html) ═════════ -->
<script>
(function () {
  var root = document.documentElement;
  var intro = document.getElementById('quIntro');
  if (!intro) return;
  if (!root.classList.contains('qu-intro-on')) {
    intro.remove();
    return;
  }

  var enterBtn = document.getElementById('quEnter');
  var skipBtn = document.getElementById('quSkip');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var inerted = [];
  var prevFocus = document.activeElement;
  var leaving = false;
  var raf = 0;

  Array.prototype.forEach.call(document.body.children, function (el) {
    if (el !== intro && !/^(SCRIPT|STYLE|LINK)$/.test(el.tagName) && !el.inert) {
      el.inert = true;
      inerted.push(el);
    }
  });
  if (enterBtn) enterBtn.focus({ preventScroll: true });

  /* ── Read configuration ── */
  var num = function (a) {
    return a.split(',').map(function (v) { return parseFloat(v); });
  };
  var door = num(intro.dataset.door || '50,58,22,56');
  var lampCfg = (intro.dataset.lamps || '').split(';').filter(Boolean).map(num);
  var stage = intro.querySelector('.qu-stage');
  var frame = intro.querySelector('.qu-frame');
  var photo = intro.querySelector('.qu-photo');
  var doorEl = intro.querySelector('.qu-door');
  var orb = intro.querySelector('.qu-orb');
  var wash = intro.querySelector('.qu-wash');
  var ar = 1.6;

  /* Door shape (arched top if requested) and flood size */
  doorEl.style.cssText =
    'left:' + (door[0] - door[2] / 2) + '%;' +
    'top:' + (door[1] - door[3] / 2) + '%;' +
    'width:' + door[2] + '%;' +
    'height:' + door[3] + '%;' +
    (intro.dataset.arch === 'true' ? 'border-radius:50% 50% 0 0 / 22% 22% 0 0;' : '');

  orb.style.cssText =
    'left:' + door[0] + '%;' +
    'top:' + door[1] + '%;' +
    'width:' + (door[2] * 1.4) + '%;' +
    'height:' + (door[3] * 1.2) + '%;' +
    '--os:' + Math.ceil(Math.max(100 / (door[2] * 1.4), 100 / (door[3] * 1.2)) * 2.4);

  /* Lamps: "x,y,glow,bulb" in % of photo width (bulb defaults to 2.2) */
  var lamps = lampCfg.map(function (c) {
    var g = document.createElement('div');
    var b = document.createElement('div');
    g.className = 'qu-glow';
    b.className = 'qu-bulb';
    g.style.cssText = 'left:' + c[0] + '%;top:' + c[1] + '%;width:' + c[2] + '%';
    b.style.cssText = 'left:' + c[0] + '%;top:' + c[1] + '%;width:' + (c[3] || 2.2) + '%';
    frame.insertBefore(g, wash);
    frame.insertBefore(b, wash);
    return { g: g, b: b, v: 1, t: 1, n: 0 };
  });

  /* ── Cover-fit the photo, keeping the doorway near centre on any screen ── */
  function layout() {
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var w = Math.max(vw, vh * ar);
    var h = w / ar;
    if (h < vh) {
      h = vh;
      w = h * ar;
    }
    var l = Math.min(0, Math.max(vw - w, vw / 2 - door[0] * w / 100));
    var t = Math.min(0, Math.max(vh - h, vh * 0.52 - door[1] * h / 100));
    frame.style.cssText = 'left:' + l + 'px;top:' + t + 'px;width:' + w + 'px;height:' + h + 'px';
    stage.style.transformOrigin = (l + door[0] * w / 100) + 'px ' + (t + door[1] * h / 100) + 'px';
  }

  var src = intro.dataset.image;
  if (src && photo) {
    photo.onload = function () {
      if (photo.naturalWidth && photo.naturalHeight) {
        ar = photo.naturalWidth / photo.naturalHeight;
        layout();
      }
      intro.classList.add('is-loaded');
    };
    photo.onerror = function () {
      photo.removeAttribute('src');
    };
    photo.src = src;
  }

  layout();
  window.addEventListener('resize', layout);

  /* ── Flickering flames: slow breathing + fast irregular jitter + occasional gutter ── */
  function flick(o, now) {
    if (now > o.n) {
      o.t = 0.72 + Math.random() * 0.28;
      if (Math.random() < 0.05) o.t = 0.45 + Math.random() * 0.15;
      o.n = now + 45 + Math.random() * 140;
    }
    o.v += (o.t - o.v) * 0.22;
    return o.v;
  }

  function tick(now) {
    var sum = 0;
    lamps.forEach(function (o, i) {
      var v = flick(o, now) * (0.94 + 0.06 * Math.sin(now / (900 + i * 370)));
      o.g.style.opacity = v.toFixed(3);
      o.g.style.transform = 'translate(-50%,-50%) scale(' + (0.9 + 0.1 * v).toFixed(3) + ')';
      o.b.style.opacity = (0.55 + 0.45 * v).toFixed(3);
      o.b.style.transform = 'translate(-50%,-50%) scale(' + (0.85 + 0.15 * v).toFixed(3) + ')';
      sum += v;
    });
    if (lamps.length && wash) {
      wash.style.opacity = (0.25 + 0.35 * sum / lamps.length).toFixed(3);
    }
    raf = requestAnimationFrame(tick);
  }

  if (reduce) {
    lamps.forEach(function (o) {
      o.g.style.opacity = 0.9;
      o.b.style.opacity = 0.95;
    });
  } else {
    raf = requestAnimationFrame(tick);
  }

  /* ── Calibration mode (?calibrate) ── */
  var calibrating = /[?&#]calibrate/.test(location.href);
  var onCalKey = null;
  if (calibrating) {
    intro.classList.add('is-calibrating');
    var panel = document.createElement('div');
    var pts = [];
    var dots = [];
    panel.className = 'qu-cal';
    intro.appendChild(panel);

    function out() {
      var t = pts.length < 2
        ? (pts.length ? 'Now click the door\u2019s BOTTOM-RIGHT corner.' : 'Click the door\u2019s TOP-LEFT corner.')
        : 'Now click each lamp bulb. Backspace undoes the last click.';
      var s = '<b>' + t + '</b><br>';
      if (pts.length >= 2) {
        var a = pts[0], b = pts[1];
        s += 'data-door="' + ((a[0] + b[0]) / 2).toFixed(1) + ',' + ((a[1] + b[1]) / 2).toFixed(1) + ',' + Math.abs(b[0] - a[0]).toFixed(1) + ',' + Math.abs(b[1] - a[1]).toFixed(1) + '"<br>';
        s += 'data-lamps="' + pts.slice(2).map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1) + ',18,2.2'; }).join(';') + '"';
      }
      panel.innerHTML = s;
    }

    frame.addEventListener('click', function (e) {
      var r = frame.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width * 100;
      var y = (e.clientY - r.top) / r.height * 100;
      pts.push([x, y]);
      var d = document.createElement('div');
      d.className = 'qu-dot';
      d.style.left = x + '%';
      d.style.top = y + '%';
      frame.appendChild(d);
      dots.push(d);
      out();
    });

    onCalKey = function (e) {
      if (e.key === 'Backspace' && pts.length) {
        pts.pop();
        var lastDot = dots.pop();
        if (lastDot) lastDot.remove();
        out();
      }
    };
    document.addEventListener('keydown', onCalKey);
    out();
  }

  /* ── Dust motes in the light ── */
  var motes = intro.querySelector('.qu-motes');
  if (!reduce && motes) {
    for (var i = 0; i < 26; i++) {
      var m = document.createElement('span');
      var st = m.style;
      st.left = (18 + Math.random() * 64) + '%';
      st.setProperty('--s', (1.5 + Math.random() * 2.5).toFixed(1) + 'px');
      st.setProperty('--d', (14 + Math.random() * 16).toFixed(1) + 's');
      st.setProperty('--dl', (-Math.random() * 20).toFixed(1) + 's');
      st.setProperty('--x', ((Math.random() - 0.5) * 120).toFixed(0) + 'px');
      st.setProperty('--o', (0.25 + Math.random() * 0.55).toFixed(2));
      motes.appendChild(m);
    }
  }

  function finish() {
    try { sessionStorage.setItem('quEntered', '1'); } catch (e) {}
    cancelAnimationFrame(raf);
    window.removeEventListener('resize', layout);
    inerted.forEach(function (el) { el.inert = false; });
    root.classList.remove('qu-intro-on', 'qu-intro-ivory');
    intro.remove();
    document.removeEventListener('keydown', onKey);
    if (onCalKey) document.removeEventListener('keydown', onCalKey);
    if (prevFocus && prevFocus.focus) {
      try { prevFocus.focus({ preventScroll: true }); } catch (e) {}
    }
  }

  function enter() {
    if (leaving) return;
    leaving = true;
    try { sessionStorage.setItem('quEntered', '1'); } catch (e) {}
    intro.classList.add('is-leaving');
    var tOpen = reduce ? 300 : 400;
    var tDone = reduce ? 1000 : 2200;
    var tEnd = tDone + (reduce ? 600 : 1100);
    setTimeout(function () { intro.classList.add('is-opening'); }, tOpen);
    setTimeout(function () { intro.classList.add('is-done'); }, tDone);
    setTimeout(finish, tEnd);
  }

  function skip() {
    if (leaving) return;
    leaving = true;
    try { sessionStorage.setItem('quEntered', '1'); } catch (e) {}
    intro.classList.add('is-skipping', 'is-done');
    setTimeout(finish, reduce ? 550 : 650);
  }

  function onKey(e) {
    if (calibrating) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      skip();
    } else if (e.key === 'Tab') {
      if (e.shiftKey && document.activeElement === enterBtn) {
        e.preventDefault();
        if (skipBtn) skipBtn.focus();
      } else if (!e.shiftKey && document.activeElement === skipBtn) {
        e.preventDefault();
        if (enterBtn) enterBtn.focus();
      }
    }
  }

  if (enterBtn) enterBtn.addEventListener('click', enter);
  if (skipBtn) skipBtn.addEventListener('click', skip);
  document.addEventListener('keydown', onKey);
})();
</script>
</body>
</html>
