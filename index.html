<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OR SO SHE THOUGHT — A Novel by Queen Usman</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --desk-bg: #0e0d0b;
      --book-cover: #161412;
      --page-bg: #f5f0e6;
      --page-bg-alt: #eae4d8;
      --ink: #1a1714;
      --ink-muted: #524c44;
      --ink-faint: #827a6e;
      --border: #d4cbbe;
      --gold: #b39966;
      --gutter-shadow: linear-gradient(to right, rgba(0,0,0,0.08), rgba(0,0,0,0.28), rgba(0,0,0,0.06));
      --font-serif: "Cormorant Garamond", Georgia, serif;
      --font-sans: "Plus Jakarta Sans", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: var(--desk-bg);
      color: var(--ink);
      font-family: var(--font-sans);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      perspective: 2000px;
    }

    /* Ambient Literary Desk Stage */
    .desk-stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 0.5rem;
    }

    /* =========================================================
       CLOSED HARDCOVER COVER STATE (The Fifth Corner Press Vibe)
       ========================================================= */
    .closed-book-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
      z-index: 50;
    }

    .closed-book-stage.opening {
      transform: scale(1.15) rotateY(-18deg) translateZ(100px);
      opacity: 0;
      pointer-events: none;
    }

    .physical-cover-object {
      width: min(75vw, 310px);
      height: min(110vw, 450px);
      background: var(--book-cover);
      border-radius: 2px 10px 10px 2px;
      position: relative;
      box-shadow: 
        -25px 40px 80px rgba(0, 0, 0, 0.85),
        -3px 0 12px rgba(0, 0, 0, 0.7) inset,
        3px 0 6px rgba(255, 255, 255, 0.08) inset;
      overflow: hidden;
      transform: rotateY(-10deg) rotateX(3deg);
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.5s ease;
    }

    .physical-cover-object:hover {
      transform: rotateY(0deg) rotateX(0deg) translateY(-6px);
      box-shadow: 0 45px 90px rgba(0, 0, 0, 0.9);
    }

    .cover-image-el {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .spine-crease-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 14px;
      width: 2px;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 1px 0 2px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }

    .open-book-prompt {
      margin-top: 2rem;
      font-size: 0.7rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(245, 240, 230, 0.5);
      font-weight: 500;
      animation: pulsePrompt 2.5s infinite ease-in-out;
    }

    @keyframes pulsePrompt {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.9; }
    }

    /* =========================================================
       OPENED TWO-PAGE SPREAD STATE (Active on Mobile and Desktop)
       ========================================================= */
    .opened-book-container {
      display: none;
      width: 100%;
      height: 100%;
      max-width: 1080px;
      max-height: 840px;
      background: var(--page-bg);
      border-radius: 3px;
      box-shadow: 0 40px 90px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255,255,255,0.05);
      position: relative;
      opacity: 0;
      transform: scale(0.95);
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.7s ease;
      overflow: hidden;
      transform-style: preserve-3d;
    }

    .opened-book-container.active {
      display: grid;
      grid-template-columns: 1fr 1fr;
      opacity: 1;
      transform: scale(1);
    }

    /* Central Spine Gutter Shadow */
    .book-gutter-shadow {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 32px;
      background: var(--gutter-shadow);
      transform: translateX(-50%);
      z-index: 20;
      pointer-events: none;
    }

    /* Physical Page Pane */
    .book-page-pane {
      padding: 1.5rem 1.25rem 1.8rem;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
      position: relative;
      -webkit-overflow-scrolling: touch;
    }

    .book-page-pane:first-child {
      border-right: 1px solid var(--border);
      background-image: linear-gradient(to left, rgba(0,0,0,0.03), transparent);
    }

    .book-page-pane:last-child {
      background-image: linear-gradient(to right, rgba(0,0,0,0.03), transparent);
    }

    @media (min-width: 600px) {
      .book-page-pane {
        padding: 2.8rem 2.4rem 3rem;
      }
    }

    /* Page Running Headers & Footers */
    .page-running-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.45rem;
      margin-bottom: 1.2rem;
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .page-running-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
      margin-top: 1.2rem;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .book-page-turn-action {
      background: none;
      border: none;
      font-family: var(--font-sans);
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      transition: opacity 0.2s ease;
    }

    .book-page-turn-action:hover {
      opacity: 0.5;
    }

    /* Typography inside Book Pages */
    .page-serif-title {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 600;
      line-height: 1.15;
      color: var(--ink);
      margin-bottom: 0.75rem;
      letter-spacing: -0.01em;
    }

    .page-serif-subtitle {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      font-style: italic;
      color: var(--ink-muted);
      margin-bottom: 0.75rem;
      line-height: 1.35;
    }

    .page-prose-text {
      font-size: 0.84rem;
      line-height: 1.75;
      color: var(--ink-muted);
      margin-bottom: 0.95rem;
    }

    .page-prose-text strong {
      color: var(--ink);
      font-weight: 600;
    }

    @media (min-width: 600px) {
      .page-serif-title { font-size: 2.15rem; }
      .page-serif-subtitle { font-size: 1.35rem; }
      .page-prose-text { font-size: 0.94rem; line-height: 1.9; }
    }

    /* Table of Contents */
    .book-toc-list {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-top: 0.3rem;
    }

    .book-toc-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 0.38rem;
      border-bottom: 1px dashed var(--border);
      cursor: pointer;
      font-family: var(--font-serif);
      font-size: 0.95rem;
      color: var(--ink);
      transition: color 0.2s ease, padding-left 0.2s ease;
    }

    .book-toc-row:hover {
      color: var(--ink-muted);
      padding-left: 5px;
    }

    .book-toc-pageNum {
      font-family: var(--font-sans);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: var(--ink-faint);
    }

    @media (min-width: 600px) {
      .book-toc-row { font-size: 1.12rem; }
    }

    /* Accordions / Folds */
    .book-fold-box {
      border: 1px solid var(--border);
      border-radius: 2px;
      margin-bottom: 0.55rem;
      background: var(--page-bg-alt);
    }

    .book-fold-toggle {
      width: 100%;
      background: none;
      border: none;
      padding: 0.7rem 0.9rem;
      text-align: left;
      font-family: var(--font-serif);
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      letter-spacing: 0.02em;
    }

    .book-fold-body {
      display: none;
      padding: 0 0.9rem 0.9rem;
      font-size: 0.82rem;
      color: var(--ink-muted);
      line-height: 1.75;
      border-top: 1px dashed var(--border);
    }

    .book-fold-box.open .book-fold-body {
      display: block;
    }

    /* Contact Form inside Book */
    .book-author-form {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-top: 0.6rem;
    }

    .book-form-input, .book-form-textarea {
      width: 100%;
      padding: 0.65rem 0.8rem;
      border: 1px solid var(--border);
      background: var(--page-bg-alt);
      font-family: var(--font-sans);
      font-size: 0.82rem;
      color: var(--ink);
      border-radius: 2px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .book-form-input:focus, .book-form-textarea:focus {
      border-color: var(--ink);
    }

    .book-form-textarea {
      min-height: 80px;
      resize: vertical;
    }

    .book-form-btn {
      width: 100%;
      padding: 0.75rem;
      background: var(--ink);
      color: var(--page-bg);
      border: none;
      font-family: var(--font-sans);
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .book-form-btn:hover {
      background: #332e29;
    }
  </style>
</head>
<body>

  <div class="desk-stage">

        </div>

    </div>

  </div>

    function openBookTransition() {
      const closed = document.getElementById('closedBookStage');
      const opened = document.getElementById('openedBookContainer');
      
      closed.classList.add('opening');
      setTimeout(() => {
        closed.style.display = 'none';
        opened.classList.add('active');
        renderSpread(0);
      }, 400);
    }

    function renderSpread(index) {
      currentSpreadIndex = index;
      const spreadData = bookSpreads[currentSpreadIndex];

      // Populate Left Page
      document.getElementById('leftHeadTitle').innerText = spreadData.left.header;
      document.getElementById('leftPageNum').innerText = spreadData.left.pageNum;
      document.getElementById('leftPageBody').innerHTML = spreadData.left.html;

      // Populate Right Page
      document.getElementById('rightHeadTitle').innerText = spreadData.right.header;
      document.getElementById('rightPageNum').innerText = spreadData.right.pageNum;
      document.getElementById('rightPageBody').innerHTML = spreadData.right.html;

      // Update Spreads Labels
      const label = `SPREAD ${currentSpreadIndex + 1} OF ${bookSpreads.length}`;
      document.getElementById('leftSpreadLabel').innerText = label;
      document.getElementById('rightSpreadLabel').innerText = label;

      // Reset scroll positions
      document.getElementById('leftPageBody').scrollTop = 0;
      document.getElementById('rightPageBody').scrollTop = 0;
    }

    function turnSpread(direction) {
      const target = currentSpreadIndex + direction;
      if (target >= 0 && target < bookSpreads.length) {
        renderSpread(target);
      } else if (target < 0) {
        // Return to closed book cover if flipping back from the first spread
        const closed = document.getElementById('closedBookStage');
        const opened = document.getElementById('openedBookContainer');
        opened.classList.remove('active');
        closed.style.display = 'flex';
        closed.classList.remove('opening');
      }
    }

    function jumpToSpread(index) {
      if (index >= 0 && index < bookSpreads.length) {
        renderSpread(index);
      }
    }

    function toggleBookFold(event, element) {
      event.stopPropagation();
      element.classList.toggle('open');
    }

    // Contact Form AJAX Handler
    document.addEventListener('submit', function(e) {
      if (e.target && e.target.id === 'authorContactForm') {
        e.preventDefault();
        const btn = document.getElementById('contactSubmitBtn');
        const form = document.getElementById('authorContactForm');
        const success = document.getElementById('contactSuccessState');

        btn.innerHTML = 'Sending...';
        btn.disabled = true;

        fetch('https://formsubmit.co/ajax/usmanshazaan@gmail.com', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('contactName').value,
            email: document.getElementById('contactEmail').value,
            message: document.getElementById('contactMessage').value,
            _subject: 'New Inquiry — Or So She Thought'
          })
        })
        .then(res => res.json())
        .then(data => {
          form.style.display = 'none';
          success.style.display = 'block';
        })
        .catch(err => {
          form.style.display = 'none';
          success.style.display = 'block';
        });
      }
    });
  </script>
